name: Build LibreCAD Plugin - Properties Sidebar - v2.2.2.6 alpha
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          cache: false
      - name: Download LibreCAD 2.2.2.6 alpha source
        run: |
          git clone --depth 1 https://github.com/LibreCAD/LibreCAD.git C:/LibreCAD
      - name: Build plugin
        run: |
          mkdir build
          cd build
          qmake ..\properties_sidebar_plugin.pro "INCLUDEPATH+=C:/LibreCAD/librecad/src"
          nmake
        shell: cmd
      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: propertiessidebar-dll-2226-alpha
          path: build/propertiessidebar.dll
